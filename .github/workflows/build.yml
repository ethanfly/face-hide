name: Build Windows client

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Install Python packages
        run: |
          python -m pip install -U pip
          python -m pip install -e . pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -q

      - name: Bump version
        id: version
        env:
          BUMP_KIND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
        run: |
          $ver = python pack/version.py bump --kind $env:BUMP_KIND
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Bumped to $ver"

      - name: Build client and installer
        run: python pack/build.py

      - name: Verify artifacts
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "dist/FaceHide-$ver-win64.zip"
          $setup = "dist/FaceHide-$ver-win64-setup.exe"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          Get-Item $zip, $setup | Format-Table Name, Length

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: FaceHide-${{ steps.version.outputs.version }}-win64-zip
          path: dist/FaceHide-${{ steps.version.outputs.version }}-win64.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FaceHide-${{ steps.version.outputs.version }}-win64-setup
          path: dist/FaceHide-${{ steps.version.outputs.version }}-win64-setup.exe
          if-no-files-found: error

      - name: Commit version and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml src/facehide/__init__.py
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "chore: release v$ver [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
          git tag -f "v$ver"
          git push -f origin "v$ver"
          $zip = "dist/FaceHide-$ver-win64.zip"
          $setup = "dist/FaceHide-$ver-win64-setup.exe"
          $notes = @"
          FaceHide v$ver

          安装程序（推荐）
          - FaceHide-$ver-win64-setup.exe
            安装后会在桌面和开始菜单创建「当面隐藏」快捷方式

          便携版
          - FaceHide-$ver-win64.zip
            解压整个文件夹后双击 FaceHide.exe，不要只拷 exe

          人脸模型已打进包内。设置和人脸只保存在本机 %LOCALAPPDATA%\FaceHide。

          Commit: ${{ github.sha }}
          "@
          gh release view "v$ver" > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$ver" $setup $zip --clobber
          } else {
            gh release create "v$ver" $setup $zip --title "FaceHide v$ver" --notes $notes
          }
