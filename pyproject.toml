[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-hide"
version = "0.1.4"
description = "指定人脸入镜后隐藏娱乐界面并打开工作软件"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10",
    "pywin32>=306",
    "psutil>=5.9",
    "PySide6>=6.6",
    "openpyxl>=3.1",
]

[project.scripts]
face-hide = "facehide.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
